<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{

background:url("img/background.jpg") center center/cover no-repeat fixed;

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

}

.overlay{

position:fixed;

left:0;

top:0;

width:100%;

height:100%;

background:rgba(0,0,0,.65);

z-index:-1;

}

.container{

width:100%;

padding:20px;

}

.card{

max-width:520px;

margin:auto;

border:1px solid #03991f;

border-radius:12px;

background:rgba(0,0,0,.35);

overflow:hidden;

animation:glow 2s infinite alternate;

}

.logo{

display:block;

width:240px;

margin:20px auto;

}

.banner{

display:block;

width:92%;

margin:0 auto;

border-radius:12px;

animation:zoom 3s infinite alternate;

}

.buttons{

display:flex;

gap:12px;

padding:20px;

}

.btn{

flex:1;

text-align:center;

padding:14px;

background:linear-gradient(135deg,#00d84a,#0b7a27);

color:#fff;

font-weight:bold;

text-decoration:none;

border-radius:8px;

transition:.3s;

}

.btn:hover{

transform:translateY(-3px);

}

.title{

padding:20px;

text-align:center;

color:#fff;

font-size:18px;

font-weight:bold;

}

@keyframes glow{

from{

box-shadow:0 0 8px #03991f;

}

to{

box-shadow:0 0 25px #03991f;

}

}

@keyframes zoom{

from{

transform:scale(1);

}

to{

transform:scale(1.03);

}

}

@media(max-width:600px){

.logo{

width:180px;

}

.buttons{

flex-direction:column;

}

}

</style>

</head>

<body>

<div class="overlay"></div>

<div class="container">

<div class="card">

<img src="img/logo.png" class="logo" alt="Logo">

<img src="img/banner.png" class="banner" alt="Banner">

<div class="buttons">

<a href="#" class="btn">
BUTTON 1
</a>

<a href="#" class="btn">
BUTTON 2
</a>

</div>

<div class="title">

Judul Landing Page

</div>

</div>

</div>
